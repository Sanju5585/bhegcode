on:
  push:
    branches: [dsstore-project-dev,dsstore-project-stage]  # Or change to your actual branch

jobs:
  build:
    runs-on: ubuntu-latest  # ✅ Safe even if you're using Windows locally

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.15.0  # ✅ Match your local Node version

      - name: Setup .npmrc for GitHub Packages
        run: |
          echo "@bh-digital-solutions:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GH_NPM_TOKEN}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
        env:
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build